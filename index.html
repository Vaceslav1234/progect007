<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Врата Времени</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: #181c1d; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff;
        }

        /* --- АНИМАЦИЯ ПЕРЕХОДА (МНОГОСЛОЙНЫЕ ОБЛАКА) --- */
        .clouds-transition {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; pointer-events: none;
            opacity: 1; visibility: visible;
            transition: opacity 0.3s ease; 
        }
        .clouds-transition.open {
            opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease 1.2s, visibility 0s 1.7s; 
        }

        .cloud-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: space-between;
        }
        .cloud-left, .cloud-right {
            position: relative; width: 60vw; height: 100vh;
            transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .cloud-left { left: 0; } 
        .cloud-right { right: 0; }

        .cloud-left::before, .cloud-left::after,
        .cloud-right::before, .cloud-right::after, .cloud-right .fluff {
            content: ''; position: absolute; border-radius: 50%; background: inherit;
        }

        .cloud-left::before { width: 50vh; height: 50vh; right: -15vh; top: 15vh; }
        .cloud-left::after { width: 60vh; height: 60vh; right: -20vh; top: 50vh; }
        .cloud-right::before { width: 45vh; height: 45vh; left: -15vh; top: 5vh; }
        .cloud-right::after { width: 55vh; height: 55vh; left: -25vh; top: 35vh; }
        .cloud-right .fluff { width: 40vh; height: 40vh; left: -10vh; top: 75vh; }

        .layer-3 .cloud-left, .layer-3 .cloud-right { background: #8ba2c2; transition-duration: 1.6s; }
        .layer-2 .cloud-left, .layer-2 .cloud-right { background: #b8c5d1; transition-duration: 1.3s; }
        .layer-1 .cloud-left, .layer-1 .cloud-right { background: #f0f4f8; transition-duration: 1.0s; }

        .clouds-transition.open .cloud-left { transform: translateX(calc(-100% - 30vh)); }
        .clouds-transition.open .cloud-right { transform: translateX(calc(100% + 30vh)); }

        /* --- ЗАДНИЙ ФОН НА 110% --- */
        .full-screen-bg {
            position: fixed; top: -5%; left: -5%; width: 110%; height: 110%;
            background-image: radial-gradient(circle at 50% 50%, transparent 40%, rgba(10, 12, 14, 0.8) 100%), url('casy_2.jpg'); 
            background-size: 100% 100%, cover; background-position: center, center; background-repeat: no-repeat; z-index: -10;
        }

        /* --- ВЕРХНИЙ БЛОК --- */
        .top-status-container { 
            position: absolute; top: 25px; 
            left: 50%; transform: translateX(-50%); 
            width: 90vw; max-width: 500px; display: flex; align-items: center; z-index: 30; 
        }
        .level-badge { position: relative; width: 55px; height: 55px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; z-index: 3; transition: transform 0.3s; }
        .level-gear-icon { position: absolute; width: 100%; height: 100%; fill: #ffd700; }
        .level-text { position: relative; z-index: 2; color: #ffffff; font-weight: 900; font-size: 24px; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 2px 4px rgba(0,0,0,0.8); }

        .top-progress-bar {
            flex-grow: 1; height: 16px; background: repeating-linear-gradient(-45deg, #222222, #222222 10px, #1a1c1d 10px, #1a1c1d 20px);
            border: 1px solid #4a433a; border-radius: 6px; position: relative; margin-left: -15px; padding-left: 15px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.9); overflow: hidden; z-index: 1; display: flex; align-items: center;
        }
        .xp-text { position: absolute; left: 20px; z-index: 5; font-size: 11px; font-weight: 900; color: #2b2b2b; letter-spacing: 0.5px; }
        .progress-fill {
            position: absolute; left: 0; top: 0; height: 100%; width: 0%; 
            background: repeating-linear-gradient(-45deg, #dcb254, #dcb254 10px, #ffdf00 10px, #ffdf00 20px);
            background-size: 28px 28px; border-radius: 4px; transition: width 0.5s ease-out; box-shadow: 0 0 10px rgba(255, 223, 0, 0.5); 
        }

        .level-up-badge { position: relative; width: 32px; height: 32px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; margin-left: -12px; z-index: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
        .level-up-gear { position: absolute; width: 100%; height: 100%; fill: #a68b5b; }
        .level-up-arrow { position: relative; z-index: 2; color: #181c1d; font-weight: 900; font-size: 16px; }

        /* --- БОКОВОЕ МЕНЮ СПРАВА --- */
        .right-side-menu {
            position: absolute; top: 100px; right: 15px;
            display: flex; flex-direction: column; gap: 15px; z-index: 30;
        }
        .side-img-btn {
            width: 45px; height: auto; cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); transition: transform 0.2s;
        }
        .side-img-btn:hover { transform: scale(1.1); }
        .side-img-btn:active { transform: scale(0.95); }

        /* --- КОРПУС ЧАСОВ --- */
        .clock-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: max(90vw, 60vh); height: max(90vw, 60vh); display: flex; justify-content: center; align-items: center; }
        .heat-ring { position: absolute; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.1s; }
        .ring-inner { top: 20%; left: 20%; right: 20%; bottom: 20%; box-shadow: inset 0 0 30px 10px rgba(255,255,255,0.9), 0 0 30px 10px rgba(255,255,255,0.7); }
        .ring-middle { top: 13%; left: 13%; right: 13%; bottom: 13%; box-shadow: inset 0 0 35px 10px rgba(0,150,255,0.9), 0 0 30px 10px rgba(0,150,255,0.6); }
        .ring-outer { top: 2%; left: 2%; right: 2%; bottom: 2%; box-shadow: inset 0 0 40px 12px rgba(255,60,60,0.9), 0 0 35px 10px rgba(32,178,170,0.8); }

        .sparks-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 14; pointer-events: none; }
        .spark { position: absolute; width: 2px; height: 10px; border-radius: 2px; background: var(--c1); box-shadow: 0 0 6px var(--c1), 0 0 10px var(--c2); pointer-events: none; will-change: transform, opacity; animation: spark-fly cubic-bezier(0.1, 1, 0.3, 1) forwards; }
        @keyframes spark-fly { 0% { transform: translate(-50%, -50%) rotate(var(--rot)) scaleY(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)) scaleY(0.2); opacity: 0; } }
        .idle-spark { position: absolute; width: 4px; height: 4px; background: #fcebbb; border-radius: 50%; box-shadow: 0 0 10px #dcb254, 0 0 5px #fff; pointer-events: none; opacity: 0; animation: idle-float 2.5s ease-in-out forwards; }
        @keyframes idle-float { 0% { transform: scale(0.5) translate(0, 0); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: scale(1.5) translate(var(--dx), var(--dy)); opacity: 0; } }
        .sand-particle { position: fixed; width: 6px; height: 6px; background: #fcebbb; border-radius: 50%; box-shadow: 0 0 10px #dcb254, 0 0 5px #fff; pointer-events: none; z-index: 50; }

        .hand { position: absolute; bottom: 50%; left: 50%; border: none; filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.8)); transform-origin: bottom center; transform: translateX(-50%) rotate(0deg); display: flex; justify-content: center; }
        .hand::after { content: ''; position: absolute; bottom: 0; background: #fcebbb; box-shadow: 0 0 6px #dcb254, 0 0 12px #ffdf00; z-index: 2; border-radius: 2px; }
        .hand-thick { width: 18px; height: 22%; background: #9ca196; z-index: 13; clip-path: polygon(50% 0%, 100% 20%, 100% 100%, 0% 100%, 0% 20%); transition: transform 9s cubic-bezier(0.6, 0, 0.1, 1) 0s; }
        .hand-thick::after { width: 2px; height: 65%; }
        .hand-medium { width: 22px; height: 38%; background: #9ca196; z-index: 12; transition: transform 11s cubic-bezier(0.6, 0, 0.1, 1) 0.8s; }
        .hand-medium::before { content: ''; position: absolute; top: 10%; bottom: 10%; left: -4px; right: -4px; background: repeating-linear-gradient(to bottom, transparent 0px, transparent 6px, #9ca196 6px, #9ca196 10px); z-index: -1; }
        .hand-medium::after { width: 2px; height: 75%; }
        .hand-thin { width: 6px; height: 44%; background: #8b7968; z-index: 11; transition: transform 15s cubic-bezier(0.5, 0, 0.1, 1) 1.8s; }
        .hand-thin::after { width: 4px; height: 98%; }

        .center-gear-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22%; height: 22%; max-width: 85px; max-height: 85px; 
            background: transparent; border: none; outline: none; cursor: pointer; z-index: 20; display: flex; justify-content: center; align-items: center; transition: transform 0.2s ease; animation: gear-pulse 2s infinite alternate;
        }
        @keyframes gear-pulse { 0% { filter: drop-shadow(0 0 10px rgba(220, 178, 84, 0.4)); } 100% { filter: drop-shadow(0 0 25px rgba(252, 235, 187, 0.8)); } }
        .gear-bg-img { position: absolute; width: 100%; height: 100%; object-fit: contain; transition: filter 0.3s ease; z-index: 1; }
        .cost-overlay { position: relative; z-index: 2; display: flex; align-items: center; gap: 1px; pointer-events: none; }
        .cost-text { color: #ffffff; font-size: 24px; font-weight: bold; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 0px 5px rgba(0,0,0,0.8); }
        .mini-hourglass { width: 18px; height: 18px; fill: #ffffff; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8)); }
        .center-gear-btn:hover:not(:disabled) .gear-bg-img { filter: brightness(1.2); }
        .center-gear-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.95); }
        .center-gear-btn:disabled { animation: none; filter: none; }
        .center-gear-btn:disabled .gear-bg-img { filter: grayscale(50%) brightness(0.6); }
        .center-gear-btn:disabled .cost-text { color: #aaaaaa; text-shadow: none; }
        .center-gear-btn:disabled .mini-hourglass { fill: #aaaaaa; filter: none; }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-menu {
            position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #0a0d10 0%, rgba(24, 28, 29, 0.95) 100%);
            border-top: 2px solid #3a3f42; padding: 10px 10px 20px 10px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 30; box-shadow: 0 -15px 30px rgba(0,0,0,0.8);
        }
        .menu-side-group { flex: 1; display: flex; justify-content: space-around; padding-bottom: 5px; align-items: center; }
        
        .menu-icon { font-size: 26px; cursor: pointer; color: #8b7968; transition: color 0.3s, transform 0.3s; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); }
        .menu-icon:hover { color: #dcb254; transform: translateY(-3px); }
        
        /* Класс для PNG картинок в меню */
        .menu-icon-img {
            width: 40px; height: auto; cursor: pointer;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); transition: transform 0.3s;
        }
        .menu-icon-img:hover { transform: translateY(-3px) scale(1.05); }

        .boy-wrapper { 
            position: relative; pointer-events: auto; cursor: pointer; 
            margin-bottom: -15px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; 
            transition: transform 0.2s;
        }
        .boy-avatar { width: 60px; height: auto; display: block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); margin-bottom: 5px; }

        .boy-sand-counter {
            position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); background: rgba(10, 13, 16, 0.95); border: 1px solid #dcb254; border-radius: 12px;
            padding: 3px 10px; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.9); z-index: 15; white-space: nowrap; pointer-events: none;
        }
        .boy-sand-counter svg { width: 14px; height: 14px; fill: #dcb254; }
        .boy-sand-counter span { color: #fcebbb; font-size: 14px; font-weight: bold; }

        /* --- ВСПЛЫВАЮЩИЕ ОКНА (OVERLAY) --- */
        .event-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(10, 13, 16, 0.7); backdrop-filter: blur(10px); 
            z-index: 100; display: flex; justify-content: center; align-items: center; 
            visibility: hidden; opacity: 0; transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .event-overlay.show { opacity: 1; pointer-events: auto; visibility: visible; }
        .event-overlay.flying { background: transparent !important; backdrop-filter: none !important; }

        /* Базовый режим (Коллекция) */
        .event-modal { 
            background: transparent; border: none; padding: 10px; width: 100vw; max-width: 500px; text-align: center; 
            transform: scale(0.8); transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.2, 1); 
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .event-overlay.show .event-modal { transform: scale(1); }
        .text-panel { width: 100%; display: flex; flex-direction: column; align-items: center; transition: opacity 0.3s; }
        .event-img { width: 100%; max-height: 55vh; object-fit: contain; border: none; margin-bottom: 15px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9)); z-index: 1; position: relative;}
        .event-title { color: #20b2aa; font-size: 26px; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 10px #000; }
        .event-desc { color: #fcebbb; font-size: 18px; line-height: 1.4; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 10px #000; }
        
        /* СТИЛЬ ЗАСТАВКИ (ДЛЯ МИНИ-ИГР) */
        .event-modal.splash-mode {
            width: 95vw; max-width: 600px; padding: 0; display: block;
        }
        .event-modal.splash-mode .event-img {
            width: 100%; height: auto; max-height: 85vh; object-fit: contain; margin: 0; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
        }
        .event-modal.splash-mode .text-panel {
            position: absolute; bottom: 8%; left: 5%; width: 90%;
            display: flex; flex-direction: row; justify-content: space-around; align-items: center;
            background: transparent; padding: 0; z-index: 2;
        }
        .event-modal.splash-mode .event-title { color: #ffffff; font-size: 24px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); margin: 0; width: 35%; text-align: center; }
        .event-modal.splash-mode .event-desc { color: #ffffff; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); margin: 0; width: 55%; text-align: center; line-height: 1.2; }

        /* --- ЛИДЕРБОРД (ТОП ИГРОКОВ) --- */
        .leaderboard-modal {
            background: linear-gradient(135deg, #1f2427, #121517) !important;
            border: 2px solid #dcb254 !important; border-radius: 15px;
            padding: 20px; width: 90vw; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(220, 178, 84, 0.1);
        }
        .lb-title { color: #ffd700; font-size: 24px; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .leaderboard-list {
            width: 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;
            max-height: 40vh; overflow-y: auto; padding-right: 5px;
        }
        .leaderboard-list::-webkit-scrollbar { width: 5px; }
        .leaderboard-list::-webkit-scrollbar-thumb { background: #dcb254; border-radius: 5px; }
        .lb-item {
            display: flex; justify-content: space-between; padding: 10px 15px;
            background: rgba(0,0,0,0.5); border-radius: 8px; border: 1px solid #4a433a;
            color: #fcebbb; font-weight: bold; font-size: 16px;
        }
        .lb-item.gold { background: rgba(255, 215, 0, 0.15); border-color: #ffd700; color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .lb-item.silver { background: rgba(192, 192, 192, 0.15); border-color: #c0c0c0; color: #c0c0c0; }
        .lb-item.bronze { background: rgba(205, 127, 50, 0.15); border-color: #cd7f32; color: #cd7f32; }
        .reward-text { color: #20b2aa; font-size: 14px; margin-bottom: 15px; line-height: 1.4; }
        .event-close-btn {
            background: linear-gradient(135deg, #c79a3c, #8c6a23); border: 1px solid #fcebbb; color: #fff; padding: 10px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.8); transition: background 0.2s, transform 0.2s;
        }
        .event-close-btn:hover { background: linear-gradient(135deg, #e2c073, #a48032); transform: translateY(-2px); }
        .event-close-btn:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.8); }

    </style>
</head>
<script type="module" src="firebase-config.js"></script>

            <div class="cloud-left"></div>
            <div class="cloud-right"><div class="fluff"></div></div>
        </div>
        <div class="cloud-layer layer-2">
            <div class="cloud-left"></div>
            <div class="cloud-right"><div class="fluff"></div></div>
        </div>
        <div class="cloud-layer layer-1">
            <div class="cloud-left"></div>
            <div class="cloud-right"><div class="fluff"></div></div>
        </div>
    </div>

    <div class="full-screen-bg"></div>

    <div class="top-status-container">
        <div class="level-badge" id="level-badge">
            <svg class="level-gear-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.05-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.92 3.32c-.12.22-.07.49.12.61l2.03 1.58c-.04.3-.06.61-.06.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.03-1.58z" /></svg>

        </div>
        <div class="top-progress-bar" id="progress-bar-container">
            <div class="progress-fill" id="progress-fill"></div>
            <span class="xp-text" id="xp-text">0 / 50</span>
        </div>
        <div class="level-up-badge">
            <svg class="level-up-gear" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.05-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.92 3.32c-.12.22-.07.49.12.61l2.03 1.58c-.04.3-.06.61-.06.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.03-1.58z" /></svg>
            <span class="level-up-arrow">↑</span>
        </div>
    </div>

    <!-- БОКОВОЕ МЕНЮ (Замок и Конверт) -->
    <div class="right-side-menu">
        <img src="castle.png" class="side-img-btn" onclick="openLeaderboard()" alt="Топ Игроков">
        <img src="mail.png" class="side-img-btn" alt="Сообщения">
    </div>

    <div class="clock-wrapper" id="wrapper">
        <div class="heat-ring ring-outer" id="ring-outer"></div>
        <div class="heat-ring ring-middle" id="ring-middle"></div>
        <div class="heat-ring ring-inner" id="ring-inner"></div>
        
        <div class="hand hand-thin" id="hand1"></div>
        <div class="hand hand-medium" id="hand2"></div>
        <div class="hand hand-thick" id="hand3"></div>
        <div class="sparks-layer" id="sparks-layer"></div>

        <button class="center-gear-btn" id="spinButton" onclick="payAndSpin()">
            <img src="buttom.png" class="gear-bg-img" alt="Запуск">
            <div class="cost-overlay">
                <span class="cost-text">10</span>
                <svg class="mini-hourglass" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 2H6v4.46l4.08 5.54L6 17.54V22h12v-4.46l-4.08-5.54L18 6.46V2zm-2 18H8v-1.46l4-5.43 4 5.43V20zM8 4h8v1.46l-4 5.43-4-5.43V4z"/></svg>
            </div>
        </button>
    </div>

    <div class="bottom-menu">
        <div class="menu-side-group" style="justify-content: flex-start; padding-left: 10px;">
            <div class="menu-icon">🎒</div>
            <div class="menu-icon" id="collection-icon" style="margin-left: 15px;">📜</div>
        </div>
        
        <!-- Чит-код: Клик по мальчику начисляет песчинки -->
        <div class="boy-wrapper" id="boy-wrapper" onclick="addTestSand()">
            <img src="ty.png" class="boy-avatar" alt="Мальчик">
            <div class="boy-sand-counter">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 2H6v4.46l4.08 5.54L6 17.54V22h12v-4.46l-4.08-5.54L18 6.46V2zm-2 18H8v-1.46l4-5.43 4 5.43V20zM8 4h8v1.46l-4 5.43-4-5.43V4z"/></svg>
                <span id="sand-display">150</span>
            </div>
        </div>

        <div class="menu-side-group" style="justify-content: flex-end; padding-right: 10px;">
            <!-- Кнопка "Назад в деревню" -->
            <img src="back.png" class="menu-icon-img" alt="Назад">
        </div>
    </div>

    <!-- МОДАЛКА КАРТОЧКИ СОБЫТИЯ -->
    <div class="event-overlay" id="event-overlay">
        <div class="event-modal" id="event-modal">
            <img src="" id="event-img" class="event-img" alt="Событие" onerror="this.style.display='none'">
            <div class="text-panel" id="text-panel">
                <h2 class="event-title" id="event-title">Год</h2>
                <p class="event-desc" id="event-desc">Описание события...</p>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ЛИДЕРБОРДА (ТОП-10) -->
    <div class="event-overlay" id="leaderboard-overlay">
        <div class="event-modal leaderboard-modal">
            <h2 class="lb-title">Топ Строителей</h2>
            <div class="leaderboard-list">
                <div class="lb-item gold"><span>1. Игрок777</span> <span>1500 XP</span></div>
                <div class="lb-item silver"><span>2. Архитектор</span> <span>1350 XP</span></div>
                <div class="lb-item bronze"><span>3. TimeMaster</span> <span>1200 XP</span></div>
                <div class="lb-item"><span>4. Builder99</span> <span>1050 XP</span></div>
                <div class="lb-item"><span>5. Alex_Q</span> <span>900 XP</span></div>
                <div class="lb-item"><span>6. Stroitel</span> <span>850 XP</span></div>
                <div class="lb-item"><span>7. Neo</span> <span>700 XP</span></div>
                <div class="lb-item"><span>8. Хронос</span> <span>650 XP</span></div>
                <div class="lb-item"><span>9. Игрок_2</span> <span>500 XP</span></div>
                <div class="lb-item"><span>10. Гость</span> <span>450 XP</span></div>
            </div>
            <p class="reward-text">Награда лучшим выдается через 7 дней!<br>🏆 +500 ⏳</p>
            <button class="event-close-btn" onclick="closeLeaderboard()">Закрыть</button>
        </div>
    </div>

    <script>
        const eventsDatabase = {
            4026: "Осень, создан Адам", 2369: "Ковчег останавливается на горах Арарат", 
            2269: "Строительство Вавилонской башни", // Тестовая дата
            1070: "Воцарение Давида над всем Израилем", 
            1034: "Начало строительства храма",
            1027: "Окончание строительства храма"
        };
        const historicalDatesList = Object.keys(eventsDatabase).map(Number);

        let gameData = JSON.parse(localStorage.getItem('timeGateData')) || {
            sandCount: 150, epochLevel: 1, currentXP: 0, targetXP: 50, pendingPoints: 0, pendingEventObj: null
        };

        let sandCount = gameData.sandCount; 
        const SPIN_COST = 10;
        let epochLevel = gameData.epochLevel;
        let currentXP = gameData.currentXP;
        let targetXP = gameData.targetXP;
        let pendingPoints = gameData.pendingPoints || 0;
        let pendingEventObj = gameData.pendingEventObj || null;

        function getRequiredXP(level) { return 50 * level; }

        let currentRotation1 = 0; let currentRotation2 = 0; let currentRotation3 = 0;
        let prevRot1 = 0; let prevRot2 = 0; let prevRot3 = 0;
        let startTime = 0; let animationFrameId; let isSpinning = false; let autoStartTimer = null;

        const hand1 = document.getElementById('hand1'); const hand2 = document.getElementById('hand2'); 
        const hand3 = document.getElementById('hand3'); const sparksLayer = document.getElementById('sparks-layer');
        const wrapper = document.getElementById('wrapper'); const btn = document.getElementById('spinButton'); 
        const sandDisplay = document.getElementById('sand-display'); const progressFill = document.getElementById('progress-fill'); 
        const levelText = document.getElementById('level-text'); const levelBadge = document.getElementById('level-badge');
        const xpTextDisplay = document.getElementById('xp-text');
        
        const eventOverlay = document.getElementById('event-overlay'); const eventImg = document.getElementById('event-img');
        const eventTitle = document.getElementById('event-title'); const eventDesc = document.getElementById('event-desc');
        const eventModal = document.getElementById('event-modal'); const collectionIcon = document.getElementById('collection-icon');
        const textPanel = document.getElementById('text-panel');
        const clouds = document.getElementById('clouds');

        window.onload = () => {
            sandDisplay.innerText = sandCount;
            levelText.innerText = epochLevel;
            xpTextDisplay.innerText = `${Math.floor(currentXP)} / ${targetXP}`;
            progressFill.style.width = `${(currentXP / targetXP) * 100}%`;

            const urlParams = new URLSearchParams(window.location.search);
            const isFromMinigame = urlParams.get('fromMinigame') === 'true';
            
            if (isFromMinigame) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            setTimeout(() => { 
                clouds.classList.add('open'); 
                
                if (isFromMinigame && pendingPoints > 0) {
                    setTimeout(() => {
                        eventModal.classList.remove('splash-mode');

                        if (pendingEventObj) {
                            eventImg.src = pendingEventObj.img;
                            eventTitle.innerText = pendingEventObj.title;
                        }

                        addXP(pendingPoints);
                        pendingPoints = 0;
                        pendingEventObj = null;
                        saveGameData();
                        flyCollectionCard(); 
                    }, 800); 
                }
            }, 200);
        };

        // --- ЛИДЕРБОРД ФУНКЦИИ ---
        function openLeaderboard() {
            document.getElementById('leaderboard-overlay').classList.add('show');
        }
        function closeLeaderboard() {
            document.getElementById('leaderboard-overlay').classList.remove('show');
        }

        // --- ЧИТ-КОД НА ПЕСЧИНКИ ---
        function addTestSand() {
            sandCount += 500;
            sandDisplay.innerText = sandCount;
            saveGameData();
            
            let boy = document.getElementById('boy-wrapper');
            boy.style.transform = 'scale(1.2) translateY(-10px)';
            setTimeout(() => { boy.style.transform = 'scale(1) translateY(0)'; }, 200);
        }

        function saveGameData() {
            gameData = { sandCount, epochLevel, currentXP, targetXP, pendingPoints, pendingEventObj };
            localStorage.setItem('timeGateData', JSON.stringify(gameData));
        }

        function goToMinigame(url) {
            saveGameData(); 
            clouds.classList.remove('open'); 
            setTimeout(() => { window.location.href = url; }, 1200); 
        }

        function processLevelUp() {
            if (currentXP >= targetXP) {
                currentXP -= targetXP;
                epochLevel++;
                levelText.innerText = epochLevel;
                levelBadge.style.transform = "scale(1.3)"; setTimeout(() => levelBadge.style.transform = "scale(1)", 300);
                targetXP = getRequiredXP(epochLevel);
                
                progressFill.style.transition = 'none'; progressFill.style.width = `0%`;
                void progressFill.offsetWidth; 
                setTimeout(() => { checkXP(); }, 100); 
            } else {
                progressFill.style.transition = 'width 0.5s ease-out';
                progressFill.style.width = `${(currentXP / targetXP) * 100}%`;
                xpTextDisplay.innerText = `${Math.floor(currentXP)} / ${targetXP}`;
                saveGameData();
            }
        }
        function checkXP() {
            if (currentXP >= targetXP) {
                progressFill.style.transition = 'width 0.3s ease-out'; progressFill.style.width = `100%`;
                xpTextDisplay.innerText = `${targetXP} / ${targetXP}`;
                setTimeout(processLevelUp, 350); 
            } else {
                progressFill.style.transition = 'width 0.5s ease-out';
                progressFill.style.width = `${(currentXP / targetXP) * 100}%`;
                xpTextDisplay.innerText = `${Math.floor(currentXP)} / ${targetXP}`;
                saveGameData();
            }
        }
        function addXP(amount) {
            currentXP += amount;
            checkXP();
        }

        function showEventModal(year, description) {
            let descLower = description.toLowerCase();
            let isConstruction = descLower.includes("строительств");
            let isMinigame = isConstruction || descLower.includes("воцарени");

            let finalImgSrc = isMinigame ? 'stro_2.png' : `${year}.png`;
            
            eventImg.style.display = 'block'; 
            eventImg.src = finalImgSrc; 
            eventTitle.innerText = `${year} год до н.э.`; 
            eventDesc.innerText = description;
            
            pendingEventObj = {
                title: `${year} год до н.э.`,
                img: finalImgSrc
            };

            if (isMinigame) {
                eventModal.classList.add('splash-mode');
                autoStartTimer = setTimeout(() => {
                    eventOverlay.classList.remove('show');
                    goToMinigame('tower.html');
                }, 5000);
            } else {
                eventModal.classList.remove('splash-mode');
                autoStartTimer = setTimeout(() => {
                    closeEventModalOnly();
                }, 5000);
            }
            
            eventOverlay.classList.add('show');
        }

        function flyCollectionCard() {
            eventOverlay.classList.add('flying');
            eventOverlay.classList.add('show'); 
            textPanel.style.opacity = '0'; 
            
            const modalRect = eventModal.getBoundingClientRect();
            const targetRect = collectionIcon.getBoundingClientRect();
            const dx = targetRect.left + targetRect.width / 2 - (modalRect.left + modalRect.width / 2);
            const dy = targetRect.top + targetRect.height / 2 - (modalRect.top + modalRect.height / 2);
            
            eventModal.style.transition = 'transform 0.6s cubic-bezier(0.5, 0, 0.2, 1), opacity 0.6s ease';
            eventModal.style.transform = `translate(${dx}px, ${dy}px) scale(0.05)`;
            eventModal.style.opacity = '0';
            
            setTimeout(() => {
                eventOverlay.classList.remove('show');
                eventOverlay.classList.remove('flying'); 
                textPanel.style.opacity = '1'; 
                collectionIcon.style.color = '#ffd700'; collectionIcon.style.transform = 'scale(1.4)';
                
                setTimeout(() => {
                    collectionIcon.style.color = ''; collectionIcon.style.transform = '';
                    eventModal.style.transition = ''; eventModal.style.transform = ''; eventModal.style.opacity = '';
                }, 300);
            }, 600);
        }

        function closeEventModalOnly() {
            addXP(pendingPoints);
            pendingPoints = 0;
            saveGameData();
            flyCollectionCard();
        }

        function getRotation(el) {
            const st = window.getComputedStyle(el); const tr = st.getPropertyValue("transform");
            if (tr === "none") return 0;
            let values = tr.split('(')[1].split(')')[0].split(',');
            return Math.atan2(parseFloat(values[1]), parseFloat(values[0])) * (180 / Math.PI);
        }

        function payAndSpin() {
            if (isSpinning) return;
            if (sandCount < SPIN_COST) { alert("Недостаточно песчинок времени!"); return; }
            sandCount -= SPIN_COST; sandDisplay.innerText = sandCount; saveGameData();
            isSpinning = true; btn.disabled = true; 
            
            const boy = document.getElementById('boy-wrapper'); const target = btn;
            const startRect = boy.getBoundingClientRect(); const endRect = target.getBoundingClientRect();
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    let particle = document.createElement('div'); particle.className = 'sand-particle';
                    particle.style.left = (startRect.left + startRect.width/2 + (Math.random() - 0.5)*30) + 'px';
                    particle.style.top = (startRect.top + startRect.height/2 + (Math.random() - 0.5)*30) + 'px';
                    document.body.appendChild(particle);

                    let endX = endRect.left + endRect.width/2; let endY = endRect.top + endRect.height/2;
                    particle.animate([
                        { transform: 'translate(0, 0) scale(1)' },
                        { transform: `translate(${(endX - parseFloat(particle.style.left))/2}px, -120px) scale(1.5)` }, 
                        { transform: `translate(${endX - parseFloat(particle.style.left)}px, ${endY - parseFloat(particle.style.top)}px) scale(0.2)` }
                    ], { duration: 700, easing: 'ease-in-out', fill: 'forwards' });
                    setTimeout(() => particle.remove(), 700);
                }, i * 40); 
            }
            setTimeout(spinClock, 800);
        }

        function spawnSparksForHand(hand, prevAngle, radius, centerX, centerY, colorMain, colorGlow) {
            let currentAngle = getRotation(hand); let speed = currentAngle - prevAngle;
            if (speed < -180) speed += 360; if (speed > 180) speed -= 360; speed = Math.abs(speed); 
            if (speed < 1.5) return currentAngle; 

            let count = Math.floor(speed / 3); 
            let rad = currentAngle * Math.PI / 180;
            let tipX = centerX + radius * Math.sin(rad); let tipY = centerY - radius * Math.cos(rad);

            for (let i = 0; i < count; i++) {
                let spark = document.createElement('div'); spark.className = 'spark';
                let tangRad = (currentAngle + 90 + (Math.random() - 0.5) * 50) * Math.PI / 180; 
                let dist = 10 + Math.random() * (speed * 8); 
                spark.style.setProperty('--c1', colorMain); spark.style.setProperty('--c2', colorGlow);
                spark.style.left = tipX + 'px'; spark.style.top = tipY + 'px';
                spark.style.setProperty('--tx', (dist * Math.sin(tangRad)) + 'px');
                spark.style.setProperty('--ty', (-dist * Math.cos(tangRad)) + 'px');
                spark.style.setProperty('--rot', (currentAngle + 90) + 'deg');
                spark.style.animationDuration = (0.3 + Math.random() * 0.4) + 's';
                sparksLayer.appendChild(spark); setTimeout(() => spark.remove(), 800); 
            }
            return currentAngle;
        }

        function renderPhysics() {
            let elapsed = Date.now() - startTime; if (elapsed > 16000) return; 
            const rect = wrapper.getBoundingClientRect(); const R = rect.height / 2;
            const centerX = rect.width / 2; const centerY = rect.height / 2;

            prevRot1 = spawnSparksForHand(hand1, prevRot1, R * 0.88, centerX, centerY, '#ffaa00', '#ff4500');
            prevRot2 = spawnSparksForHand(hand2, prevRot2, R * 0.64, centerX, centerY, '#ff8c00', '#ff0000');
            prevRot3 = spawnSparksForHand(hand3, prevRot3, R * 0.44, centerX, centerY, '#ffb732', '#ff4500');
            animationFrameId = requestAnimationFrame(renderPhysics);
        }

        function spinClock() {
            const randomYear = 2269; 

            pendingPoints = 10;
            
            if (eventsDatabase[randomYear]) pendingPoints = 30;
            if (randomYear % 500 === 0) pendingPoints = 100; 
            saveGameData(); 

            currentRotation3 += (360 * 6) + Math.floor(Math.random() * 360); 
            currentRotation2 += (360 * 10) + Math.floor(Math.random() * 360); 
            currentRotation1 += (360 * 16) + Math.floor(Math.random() * 360); 

            prevRot1 = getRotation(hand1); prevRot2 = getRotation(hand2); prevRot3 = getRotation(hand3);
            hand3.style.transform = `translateX(-50%) rotate(${currentRotation3}deg)`;
            hand2.style.transform = `translateX(-50%) rotate(${currentRotation2}deg)`;
            hand1.style.transform = `translateX(-50%) rotate(${currentRotation1}deg)`;

            startTime = Date.now(); cancelAnimationFrame(animationFrameId); requestAnimationFrame(renderPhysics);

            setTimeout(() => {
                isSpinning = false; btn.disabled = false;
                showEventModal(randomYear, eventsDatabase[randomYear] || "Неизвестная эпоха");
            }, 16800); 
        }

        function startIdleAnimation() {
            setInterval(() => {
                if (isSpinning) return; 
                const rect = wrapper.getBoundingClientRect();
                const centerX = rect.width / 2; const centerY = rect.height / 2;
                let spark = document.createElement('div'); spark.className = 'idle-spark';
                let angle = Math.random() * Math.PI * 2; let radius = 40 + Math.random() * 80; 
                spark.style.left = centerX + Math.cos(angle) * radius + 'px';
                spark.style.top = centerY + Math.sin(angle) * radius + 'px';
                spark.style.setProperty('--dx', (Math.random() - 0.5) * 40 + 'px');
                spark.style.setProperty('--dy', (Math.random() - 0.5) * 40 - 20 + 'px');
                sparksLayer.appendChild(spark);
                setTimeout(() => spark.remove(), 2500);
            }, 350); 
        }
        startIdleAnimation();
    </script>
</body>
</html>
