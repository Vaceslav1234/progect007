<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Отключаем нативный зум браузера, чтобы наш "щипок" работал без конфликтов -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Главный экран RPG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; 
            touch-action: none; /* Блокируем стандартные жесты браузера (смахивания) */
        }

        body {
            background-color: #355f6b; 
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-screen {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #355f6b;
            overflow: hidden;
        }

        /* --- СЛОЙ КАРТЫ --- */
        .background-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            cursor: grab;
        }
        .background-layer:active {
            cursor: grabbing;
        }
        .island-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: 0 0;
            /* Убрали transition, чтобы пальцевый зум был моментальным и не "отставал" */
        }

        /* --- СЛОЙ ИНТЕРФЕЙСА --- */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            pointer-events: none; 
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* ЛЕВАЯ ПАНЕЛЬ (Игрок) */
        .player-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            background: rgba(30, 35, 45, 0.7);
            padding: 8px 15px 8px 8px;
            border-radius: 12px;
            border: 1px solid rgba(226, 192, 115, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        
        .avatar-frame {
            width: 50px; 
            height: 50px; 
            background: rgba(0, 0, 0, 0.5); /* Пустое место под вашу картинку */
            border: 2px solid #e2c073;
            border-radius: 8px; /* Сделал форму слегка квадратной с закруглениями, как в играх */
        }

        .player-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .player-name {
            font-size: 16px; 
            font-weight: bold;
            color: #fcebbb;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .vitality-track {
            width: 100px; 
            height: 8px; 
            background: rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            border: 1px solid #555;
            overflow: hidden;
        }
        .vitality-fill {
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, #d94838, #e2c073);
        }

        /* ПРАВАЯ ПАНЕЛЬ (Монетизация) */
        .currency-panel {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            background: rgba(30, 35, 45, 0.7);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid rgba(226, 192, 115, 0.2);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .currency-icon {
            font-size: 20px;
        }

        .currency-amount {
            font-size: 16px;
            font-weight: bold;
            color: #fcebbb;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

    </style>
</head>
<body>

    <div id="game-screen">
        
        <!-- КАРТА -->
        <div class="background-layer" id="map-container">
            <img src="viledges_2.jpg" class="island-image" id="map-image" alt="Остров">
        </div>

        <!-- ИНТЕРФЕЙС -->
        <div class="ui-layer">
            
            <!-- Левый блок: Игрок -->
            <div class="player-panel">
                <div class="avatar-frame"></div> <!-- Сюда потом вставите <img> -->
                <div class="player-info">
                    <div class="player-name">Странник #90</div>
                    <div class="vitality-track"><div class="vitality-fill"></div></div>
                </div>
            </div>

            <!-- Правый блок: Валюта -->
            <div class="currency-panel">
                <span class="currency-icon">💰</span>
                <span class="currency-amount">1 250</span>
            </div>

        </div>

    </div>

    <script>
        const mapContainer = document.getElementById('map-container');
        const mapImage = document.getElementById('map-image');

        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;

        // Переменные для мобильного мультитача (зум двумя пальцами)
        let isPanning = false;
        let isZooming = false;
        let lastTouchDistance = 0;

        function setTransform() {
            mapImage.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // ==========================================
        // УПРАВЛЕНИЕ МЫШЬЮ (Для компьютера)
        // ==========================================
        mapContainer.addEventListener('mousedown', (e) => {
            isPanning = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });
        
        window.addEventListener('mouseup', () => isPanning = false);
        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            setTransform();
        });

        mapContainer.addEventListener('wheel', (e) => {
            let xs = (e.clientX - pointX) / scale;
            let ys = (e.clientY - pointY) / scale;
            
            let delta = (e.wheelDelta ? e.wheelDelta : -e.deltaY);
            (delta > 0) ? (scale *= 1.1) : (scale /= 1.1);
            
            scale = Math.max(0.5, Math.min(scale, 4)); 

            pointX = e.clientX - xs * scale;
            pointY = e.clientY - ys * scale;
            setTransform();
        });

        // ==========================================
        // УПРАВЛЕНИЕ ПАЛЬЦАМИ (Для смартфона)
        // ==========================================
        mapContainer.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                // Один палец - двигаем карту
                isPanning = true;
                isZooming = false;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
            } 
            else if (e.touches.length === 2) {
                // Два пальца - начинаем зум
                isPanning = false;
                isZooming = true;
                // Высчитываем начальное расстояние между двумя пальцами
                lastTouchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        mapContainer.addEventListener('touchmove', (e) => {
            if (isPanning && e.touches.length === 1) {
                // Двигаем карту
                pointX = e.touches[0].clientX - startX;
                pointY = e.touches[0].clientY - startY;
                setTransform();
            } 
            else if (isZooming && e.touches.length === 2) {
                // Высчитываем текущее расстояние
                let currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                // Коэффициент изменения (раздвинули пальцы или сдвинули)
                let zoomFactor = currentDistance / lastTouchDistance;
                lastTouchDistance = currentDistance; // Обновляем для следующего кадра

                // Находим центр между двумя пальцами, чтобы зумить именно туда
                let centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                let centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;

                let xs = (centerX - pointX) / scale;
                let ys = (centerY - pointY) / scale;

                scale *= zoomFactor;
                scale = Math.max(0.5, Math.min(scale, 4)); // Лимит масштаба

                pointX = centerX - xs * scale;
                pointY = centerY - ys * scale;
                
                setTransform();
            }
        });

        mapContainer.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) isZooming = false;
            if (e.touches.length === 0) isPanning = false;
            
            // Если убрали один палец из двух, сбрасываем координаты перетаскивания, 
            // чтобы карта не дернулась вслед за оставшимся пальцем.
            if (e.touches.length === 1) {
                isPanning = true;
                startX = e.touches[0].clientX - pointX;
                startY = e.touches[0].clientY - pointY;
            }
        });

    </script>
</body>
</html>
